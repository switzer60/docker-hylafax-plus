# hylafax+ on Alpine - reference docker-compose.
#
# Default path: pull the image Jenkins already built and pushed - no local
# build needed. `docker compose up -d` after `docker login` to the registry
# (private image; see ci/JENKINS.md) is enough to get a running container.
#
# Building locally instead (e.g. to test a Dockerfile/entrypoint.sh change
# before it's pushed) is one file away: docker-compose.override.yml adds a
# `build:` block that docker compose merges in automatically whenever it's
# present in the same directory - no flag needed, just
# `docker compose build && docker compose up -d`. See docs/BUILD.md.
#
# Every runtime-tunable piece of hylafax+ that the entrypoint understands is
# exposed here as an environment variable. Copy .env.example to .env, edit
# it, and `docker compose up -d`. Full reference: docs/CONFIGURATION.md.
# Nothing below is required to get a container running - HYLAFAX_ADMIN_PASSWORD
# is optional (a random one is generated and printed to `docker compose logs`
# on first boot if you don't set one) and MODEM_COUNT defaults to 0, so a
# bare `docker compose up -d` with no .env at all works; you'll want to set
# at least one modem before this is useful as an actual fax server.
#
# Anything not covered by an env var can still be set: drop a file into
# ./config-overrides/ (mounted at /config-overrides) named `config`,
# `hosts.hfaxd`, or `config.<devid>` and it replaces the generated file
# verbatim, applied last, on every container start. This is the escape
# hatch for the ~150 hylafax-config(5F) parameters we don't turn into their
# own env var.
services:
  fax:
    image: ${REGISTRY:-[redacted]}/${IMAGE_NAMESPACE:-switzer60}/hylafax-plus:${IMAGE_TAG:-latest}
    hostname: fax
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      TZ: ${TZ:-UTC}

      # --- Identity & dialing (server-wide defaults; can be overridden
      #     per modem below) -----------------------------------------------
      FAX_COUNTRY_CODE: ${FAX_COUNTRY_CODE:-1}
      FAX_AREA_CODE: ${FAX_AREA_CODE:-000}
      FAX_LONG_DISTANCE_PREFIX: ${FAX_LONG_DISTANCE_PREFIX:-1}
      FAX_INTERNATIONAL_PREFIX: ${FAX_INTERNATIONAL_PREFIX:-011}
      # One of the files shipped under var/spool/hylafaxplus/etc/dialrules*,
      # e.g. dialrules, dialrules.europe, dialrules.uk, dialrules.world.
      FAX_DIAL_RULES: ${FAX_DIAL_RULES:-dialrules}
      FAX_TIMEOFDAY: ${FAX_TIMEOFDAY:-Any}

      # --- Scheduler behaviour --------------------------------------------
      FAX_MAX_DIALS: ${FAX_MAX_DIALS:-12}
      FAX_MAX_TRIES: ${FAX_MAX_TRIES:-3}
      FAX_MAX_CONCURRENT_CALLS: ${FAX_MAX_CONCURRENT_CALLS:-1}
      FAX_POSTSCRIPT_TIMEOUT: ${FAX_POSTSCRIPT_TIMEOUT:-180}
      FAX_SERVER_TRACING: ${FAX_SERVER_TRACING:-1}
      FAX_SESSION_TRACING: ${FAX_SESSION_TRACING:-0xFFF}
      FAX_LOG_FACILITY: ${FAX_LOG_FACILITY:-daemon}

      # --- hfaxd (client-server protocol on TCP) --------------------------
      HFAXD_ENABLE: ${HFAXD_ENABLE:-yes}
      HFAXD_PORT: ${HFAXD_PORT:-4559}
      HFAXD_BIND_ADDRESS: ${HFAXD_BIND_ADDRESS:-0.0.0.0}

      # --- Access control --------------------------------------------------
      # Bootstraps one administrative user into etc/hosts.hfaxd. Leave
      # HYLAFAX_ADMIN_PASSWORD unset and the entrypoint generates one on
      # first boot and prints it once to `docker compose logs` - the same
      # generated password survives container restarts (it's persisted in
      # the hylafax_spool volume), so restarting never locks you out or
      # silently rotates it. Set the var explicitly to pin or change it.
      HYLAFAX_ADMIN_USER: ${HYLAFAX_ADMIN_USER:-admin}
      HYLAFAX_ADMIN_PASSWORD: ${HYLAFAX_ADMIN_PASSWORD:-}
      HYLAFAX_ADMIN_ADMINWORD: ${HYLAFAX_ADMIN_ADMINWORD:-}
      # Comma-separated extra hosts.hfaxd entries, e.g.
      # "192.168.1.0/24,^.*@trusted\\.example\\.com$"
      HYLAFAX_ALLOW_HOSTS: ${HYLAFAX_ALLOW_HOSTS:-}

      # --- Modems -----------------------------------------------------------
      # How many MODEM_<N>_* blocks below are active. 0 (the default) boots
      # faxq/hfaxd with no modem at all, so you can pull this image and look
      # around before wiring anything up. Set to 1+ and fill in a MODEM_1_*
      # block (below) to actually send/receive faxes; add more blocks and
      # bump this further to scale past 2 - the entrypoint loops 1..MODEM_COUNT.
      MODEM_COUNT: ${MODEM_COUNT:-0}

      # Modem 1 - defaults to a software modem over IAX2/VoIP (iaxmodem),
      # which needs no hardware and works on any host, including this one.
      # See docs/MODEMS.md for how to point IAX_SERVER at Asterisk/FreePBX.
      MODEM_1_TYPE: ${MODEM_1_TYPE:-iaxmodem}
      MODEM_1_DEVICE: ${MODEM_1_DEVICE:-ttyIAX0}
      MODEM_1_PROFILE: ${MODEM_1_PROFILE:-}
      MODEM_1_FAX_NUMBER: ${MODEM_1_FAX_NUMBER:-}
      MODEM_1_LOCAL_ID: ${MODEM_1_LOCAL_ID:-HylaFAX}
      MODEM_1_IAX_SERVER: ${MODEM_1_IAX_SERVER:-}
      MODEM_1_IAX_PORT: ${MODEM_1_IAX_PORT:-4569}
      MODEM_1_IAX_PEER_NAME: ${MODEM_1_IAX_PEER_NAME:-}
      MODEM_1_IAX_PEER_SECRET: ${MODEM_1_IAX_PEER_SECRET:-}
      MODEM_1_IAX_CIDNAME: ${MODEM_1_IAX_CIDNAME:-}
      MODEM_1_IAX_CIDNUMBER: ${MODEM_1_IAX_CIDNUMBER:-}
      MODEM_1_IAX_CODEC: ${MODEM_1_IAX_CODEC:-alaw}

      # Modem 2 - commented pattern for a real, physically attached modem.
      # Uncomment, set MODEM_COUNT=2 above, and see the matching entry
      # under `devices:` below.
      # MODEM_2_TYPE: serial
      # MODEM_2_DEVICE: ttyUSB0
      # MODEM_2_PROFILE: usr-2.0   # any file under var/spool/hylafaxplus/config/
      # MODEM_2_FAX_NUMBER: "+19195551213"
      # MODEM_2_LOCAL_ID: "Front Desk Fax"

    ports:
      - "${HFAXD_PORT:-4559}:4559"
      # SNPP paging protocol, off by default (see HFAXD_SNPP_* in
      # docs/CONFIGURATION.md if you need it).
      # - "444:444"

    # Uncomment to attach a real USB/serial modem for MODEM_2 above. Find
    # the stable path with `ls -l /dev/serial/by-id/` on the host - never a
    # bare /dev/ttyUSBx, since enumeration order can change across reboots.
    # devices:
    #   - "/dev/serial/by-id/usb-USRobotics_...-if00-port0:/dev/ttyUSB0"

    volumes:
      - hylafax_spool:/var/spool/hylafaxplus
      - ./config-overrides:/config-overrides:ro

    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  hylafax_spool:
